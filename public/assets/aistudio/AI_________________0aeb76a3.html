<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 加入 viewport-fit=cover 支援 iPhone 瀏海屏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 全媒體問候提示詞設計師(開源正式版)</title>
    <style>
        :root {
            --primary-color: #333333;
            --bg-color: #ffffff;
            --sidebar-bg: #f8f9fa;
            --border-color: #e0e0e0;
            --hover-color: #f1f3f5;
            --btn-color: #000000;
            --btn-text: #ffffff;
        }
        
        * { 
            box-sizing: border-box; 
            /* 優先使用 Apple 系統字體 */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            /* 移除 iOS 點擊時的灰色高光背景 */
            -webkit-tap-highlight-color: transparent; 
        }
        
        html { 
            /* 解決 Safari 底部導覽列造成的 100vh 跑版問題 */
            height: -webkit-fill-available;
            background-color: #000; /* 手機版外圍背景設為深色或與主題相近 */
        }
        
        body { 
            margin: 0 auto; 
            display: flex; 
            width: 100%; 
            max-width: 100%; /* 放寬為 100% 滿版適配所有手機螢幕 */
            /* 使用動態視口高度 dvh，並向下相容 */
            height: 100dvh; 
            min-height: -webkit-fill-available; 
            background-color: var(--bg-color); 
            color: var(--primary-color); 
            position: relative; 
            overflow: hidden; 
            /* 適配 iPhone 安全區域 (Notch / Home bar) */
            padding-bottom: env(safe-area-inset-bottom);
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        
        .overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 900; }
        .overlay.active { display: block; }
        
        .sidebar { 
            position: absolute; left: -100%; top: 0; height: 100%; width: 280px; max-width: 80vw;
            background-color: var(--sidebar-bg); display: flex; flex-direction: column; 
            transition: left 0.3s ease; overflow-y: auto; z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.2);
            -webkit-overflow-scrolling: touch; /* iOS 慣性滑動 */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .sidebar.active { left: 0; }
        
        .sidebar-header { padding: 20px 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background-color: #fff; position: sticky; top: 0; z-index: 10; }
        .sidebar-header h2 { margin: 0; font-size: 1.1rem; }
        .close-btn { background: none; border: none; font-size: 1.5rem; color: #666; cursor: pointer; padding: 0; }
        .dimension-group { margin-bottom: 5px; }
        .dimension-title { padding: 15px; font-weight: bold; background: #f1f3f5; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; font-size: 1rem;}
        .formula-list { list-style: none; padding: 0; margin: 0; }
        .formula-item { padding: 12px 15px 12px 30px; cursor: pointer; border-bottom: 1px solid #f0f0f0; transition: background 0.2s; font-size: 0.95rem; }
        .formula-item:hover, .formula-item.active { background-color: #e9ecef; border-left: 4px solid var(--btn-color); padding-left: 26px; font-weight: bold;}
        
        .main-content { 
            flex: 1; display: flex; flex-direction: column; overflow-y: auto; scroll-behavior: smooth; width: 100%; 
            -webkit-overflow-scrolling: touch; /* iOS 慣性滑動 */
        }
        
        .topbar { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; background-color: #fff; position: sticky; top: 0; z-index: 10;}
        .toggle-btn { background: none; border: 1px solid var(--border-color); padding: 5px 12px; cursor: pointer; border-radius: 4px; margin-right: 15px; font-size: 1.2rem; }
        .topbar-title { font-weight: bold; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .content-body { padding: 20px 15px; width: 100%; }
        h1 { margin-top: 0; border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; font-size: 1.2rem; line-height: 1.3; }
        
        .section-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); background: #fff;}
        .section-card h3 { margin-top: 0; margin-bottom: 15px; color: #444; border-left: 4px solid var(--primary-color); padding-left: 10px; font-size: 1.05rem;}
        
        .var-row { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px dashed #eee; }
        .var-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .var-row label { display: block; font-weight: bold; margin-bottom: 8px; color: #222; font-size: 0.95rem;}
        
        .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: bold; font-size: 0.95rem; color: #222;}
        .setting-row input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: var(--primary-color); }
        .input-group { display: flex; gap: 10px; flex-direction: column;}
        
        /* 核心優化：iOS 表單元素防縮放與樣式統一 */
        select, input[type="text"], textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            font-size: 16px !important; /* CRITICAL: 防止 iOS Safari 點擊時強制放大畫面 */
            background-color: #fafafa; 
            -webkit-appearance: none; /* 移除 iOS 預設樣式 */
            appearance: none;
        }
        
        /* 自訂 select 的下拉箭頭 (因 appearance:none 會隱藏預設箭頭) */
        select {
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23333%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 12px auto;
            padding-right: 40px;
        }
        
        select:focus, input:focus, textarea:focus { outline: none; border-color: #555; background-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,0.1);}
        
        .sig-dropdown { border: 1px solid var(--border-color); border-radius: 6px; background: #fafafa; margin-bottom: 5px; }
        .sig-summary { padding: 12px 15px; font-weight: bold; font-size: 0.95rem; cursor: pointer; list-style: none; user-select: none; display: flex; justify-content: space-between; align-items: center; color: #444;}
        .sig-summary::-webkit-details-marker { display: none; }
        .sig-dropdown[open] .sig-summary { border-bottom: 1px solid var(--border-color); background: #f1f3f5; color: #000;}
        .sig-slots-wrapper { padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #fff; border-radius: 0 0 6px 6px; max-height: 250px; overflow-y: auto; -webkit-overflow-scrolling: touch;}
        .sig-slot { display: flex; align-items: center; gap: 10px; }
        .sig-slot input[type="radio"] { width: 22px; height: 22px; accent-color: var(--primary-color); cursor: pointer; flex-shrink: 0;}
        .sig-slot input[type="text"] { flex: 1; padding: 10px; background: #fff; }

        .context-tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 5px; border: 1px solid var(--border-color); background: #f8f9fa; cursor: pointer; border-radius: 6px; font-weight: bold; color: #555; flex: 1 1 30%; text-align: center; font-size: 0.85rem;}
        .tab-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color);}
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .output-area textarea { width: 100%; height: 250px; resize: none; line-height: 1.5; font-family: 'Consolas', 'Courier New', monospace; font-size: 16px; padding: 15px; background: #fdfdfd;}
        
        .action-btns { display: flex; gap: 10px; margin-top: 15px; flex-direction: column;}
        button.primary-btn { background: var(--btn-color); color: var(--btn-text); border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-size: 1.05rem; font-weight: bold; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.1s;}
        button.primary-btn:active { opacity: 0.85; transform: scale(0.98); } /* 手機端點擊回饋 */
        button.secondary-btn { background: #fff; color: var(--btn-color); border: 2px solid var(--btn-color); padding: 12px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; transition: transform 0.1s;}
        button.secondary-btn:active { background: #f1f1f1; transform: scale(0.98); }
        .date-info { margin-top: 15px; font-size: 0.9rem; color: #666; font-weight: bold; text-align: center;}
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>全天候語庫 (終極版)</h2>
            <button class="close-btn" onclick="toggleSidebar()">×</button>
        </div>
        <div id="sidebar-menu"></div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
            <span class="topbar-title">AI 全媒體問候設計師(手機優化版)</span>
        </div>
        
        <div class="content-body">
            <h1 id="formula-title">👈 請由左上角選單選擇公式</h1>
            
            <div class="section-card" id="general-settings-section" style="display: none;">
                <h3>⚙️ 通用排版設定</h3>
                
                <!-- 署名設定列 -->
                <div class="setting-row" style="margin-bottom: 5px;">
                    <label style="margin-bottom: 0;">🔹 自訂署名 (打字即記憶)</label>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label for="show-signature" style="margin-bottom: 0; font-size: 0.9rem; color: #555; cursor: pointer;">顯示署名</label>
                        <input type="checkbox" id="show-signature" checked>
                    </div>
                </div>
                
                <details class="sig-dropdown" id="sig-dropdown">
                    <summary class="sig-summary">
                        <span id="current-sig-display">點此展開選取署名 ▼</span>
                    </summary>
                    <div class="sig-slots-wrapper">
                        <div class="sig-slot">
                            <input type="radio" name="sig-select" id="sig-radio-0" value="0" onchange="saveSignatures()" checked>
                            <input type="text" id="sig-input-0" placeholder="欄位 1 (例如: 琦閔~祝福您)" oninput="saveSignatures()">
                        </div>
                        <div class="sig-slot">
                            <input type="radio" name="sig-select" id="sig-radio-1" value="1" onchange="saveSignatures()">
                            <input type="text" id="sig-input-1" placeholder="欄位 2" oninput="saveSignatures()">
                        </div>
                        <div class="sig-slot">
                            <input type="radio" name="sig-select" id="sig-radio-2" value="2" onchange="saveSignatures()">
                            <input type="text" id="sig-input-2" placeholder="欄位 3" oninput="saveSignatures()">
                        </div>
                        <div class="sig-slot">
                            <input type="radio" name="sig-select" id="sig-radio-3" value="3" onchange="saveSignatures()">
                            <input type="text" id="sig-input-3" placeholder="欄位 4" oninput="saveSignatures()">
                        </div>
                        <div class="sig-slot">
                            <input type="radio" name="sig-select" id="sig-radio-4" value="4" onchange="saveSignatures()">
                            <input type="text" id="sig-input-4" placeholder="欄位 5" oninput="saveSignatures()">
                        </div>
                        <div class="sig-slot">
                            <input type="radio" name="sig-select" id="sig-radio-5" value="5" onchange="saveSignatures()">
                            <input type="text" id="sig-input-5" placeholder="欄位 6" oninput="saveSignatures()">
                        </div>
                        <div class="sig-slot">
                            <input type="radio" name="sig-select" id="sig-radio-6" value="6" onchange="saveSignatures()">
                            <input type="text" id="sig-input-6" placeholder="欄位 7" oninput="saveSignatures()">
                        </div>
                        <div class="sig-slot">
                            <input type="radio" name="sig-select" id="sig-radio-7" value="7" onchange="saveSignatures()">
                            <input type="text" id="sig-input-7" placeholder="欄位 8" oninput="saveSignatures()">
                        </div>
                        <div class="sig-slot">
                            <input type="radio" name="sig-select" id="sig-radio-8" value="8" onchange="saveSignatures()">
                            <input type="text" id="sig-input-8" placeholder="欄位 9" oninput="saveSignatures()">
                        </div>
                        <div class="sig-slot">
                            <input type="radio" name="sig-select" id="sig-radio-9" value="9" onchange="saveSignatures()">
                            <input type="text" id="sig-input-9" placeholder="欄位 10" oninput="saveSignatures()">
                        </div>
                    </div>
                </details>

                <!-- 日期設定列 -->
                <div class="setting-row" style="margin-top: 20px;">
                    <label for="show-date" style="cursor: pointer;">🔹 於圖片/影片中顯示日期</label>
                    <input type="checkbox" id="show-date" checked>
                </div>

                
                <!-- 🌟 生成圖片張數設定列 -->
                <div class="setting-row" style="margin-top: 15px; border-top: 1px dashed var(--border-color); padding-top: 15px; margin-bottom: 5px;">
                    <label style="margin-bottom: 0;">🔹 生成圖片張數 (獨立多圖生成)</label>
                </div>
                <p style="font-size: 0.85rem; color: #555; margin: 0 0 10px 0; font-weight: normal;">* 系統將自動強化提示詞，強制 AI 分別輸出多張獨立圖片，避免產生單張四宮格/九宮格等分割畫面。</p>
                <div class="input-group" style="margin-bottom: 10px;">
                    <div style="display: flex; gap: 8px; width: 100%;">
                        <select id="image-count-select" onchange="handleImageCountSelectChange()" style="flex: 1;"></select>
                        <button type="button" id="edit-image-count-btn" onclick="toggleEditImageCountMode()" class="secondary-btn" style="width: auto; padding: 0 12px; font-size: 0.9rem; height: 44px; margin: 0;">✏️ 編輯</button>
                    </div>
                    
                    <!-- 編輯模式：刪除與復原 -->
                    <div id="edit-image-count-actions" style="display: none; gap: 8px; margin-top: 5px; flex-direction: row; flex-wrap: wrap; justify-content: flex-end;">
                        <button type="button" onclick="deleteSelectedImageCount()" class="secondary-btn" style="width: auto; padding: 0 10px; font-size: 0.85rem; height: 38px; margin: 0; color: #d32f2f; border-color: #d32f2f;">🗑️ 刪除選項</button>
                        <button type="button" onclick="restoreDefaultImageCounts(true)" class="secondary-btn" style="width: auto; padding: 0 10px; font-size: 0.85rem; height: 38px; margin: 0;">🔄 復原(保留新增)</button>
                        <button type="button" onclick="restoreDefaultImageCounts(false)" class="secondary-btn" style="width: auto; padding: 0 10px; font-size: 0.85rem; height: 38px; margin: 0;">🔄 復原(清空新增)</button>
                    </div>

                    <!-- 自行填寫與新增的隱藏區域 -->
                    <div id="custom-image-count-wrapper" style="display: none; gap: 8px; margin-top: 5px; flex-direction: row; align-items: center;">
                        <input type="text" id="image-count-custom" placeholder="請輸入欲新增的張數 (例如: 8張)..." style="flex: 1; height: 44px; margin: 0;">
                        <button type="button" onclick="addNewImageCount()" class="secondary-btn" style="width: auto; padding: 0 12px; font-size: 0.9rem; height: 44px; margin: 0; white-space: nowrap;">➕ 新增選項</button>
                    </div>
                </div>
<!-- 🌟 專屬圖框設定列 -->
                <div class="setting-row" style="margin-top: 15px; border-top: 1px dashed var(--border-color); padding-top: 15px; margin-bottom: 5px;">
                    <label style="margin-bottom: 0;">🔹 署名與日期圖框 (自訂清單)</label>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label for="show-frame" style="margin-bottom: 0; font-size: 0.9rem; color: #555; cursor: pointer;">啟用圖框</label>
                        <input type="checkbox" id="show-frame" checked>
                    </div>
                </div>
                <div class="input-group" style="margin-bottom: 10px;">
                    <div style="display: flex; gap: 8px; width: 100%;">
                        <select id="frame-select" onchange="handleFrameSelectChange()" style="flex: 1;"></select>
                        <button type="button" id="edit-frame-btn" onclick="toggleEditFrameMode()" class="secondary-btn" style="width: auto; padding: 0 12px; font-size: 0.9rem; height: 44px; margin: 0;">✏️ 編輯</button>
                    </div>
                    
                    <!-- 編輯模式：刪除與復原 -->
                    <div id="edit-frame-actions" style="display: none; gap: 8px; margin-top: 5px; flex-direction: row; flex-wrap: wrap; justify-content: flex-end;">
                        <button type="button" onclick="deleteSelectedFrame()" class="secondary-btn" style="width: auto; padding: 0 10px; font-size: 0.85rem; height: 38px; margin: 0; color: #d32f2f; border-color: #d32f2f;">🗑️ 刪除選項</button>
                        <button type="button" onclick="restoreDefaultFrames(true)" class="secondary-btn" style="width: auto; padding: 0 10px; font-size: 0.85rem; height: 38px; margin: 0;">🔄 復原(保留新增)</button>
                        <button type="button" onclick="restoreDefaultFrames(false)" class="secondary-btn" style="width: auto; padding: 0 10px; font-size: 0.85rem; height: 38px; margin: 0;">🔄 復原(清空新增)</button>
                    </div>

                    <!-- 自行填寫與新增的隱藏區域 -->
                    <div id="custom-frame-wrapper" style="display: none; gap: 8px; margin-top: 5px; flex-direction: row; align-items: center;">
                        <input type="text" id="frame-custom" placeholder="請輸入欲新增的圖框樣式..." style="flex: 1; height: 44px; margin: 0;">
                        <button type="button" onclick="addNewFrame()" class="secondary-btn" style="width: auto; padding: 0 12px; font-size: 0.9rem; height: 44px; margin: 0; white-space: nowrap;">➕ 新增選項</button>
                    </div>
                </div>

            </div>

            <div class="section-card" id="variables-section" style="display: none;">
                <h3>🎨 巨量參數設定</h3>
                <div id="variables-container"></div>
            </div>

            <div class="section-card" id="context-section" style="display: none;">
                <h3>📝 情境與金句補充 (選填)</h3>
                <div class="context-tabs">
                    <button class="tab-btn active" onclick="switchTab('text')">指定文字</button>
                    <button class="tab-btn" onclick="switchTab('url')">參考網址</button>
                    <button class="tab-btn" onclick="switchTab('file')">檔案模擬</button>
                </div>
                <div id="tab-text" class="tab-content active">
                    <textarea id="context-text" rows="4" placeholder="例如：請將問候語設定為『日落星起，願你卸下一身的疲憊。晚安。』..."></textarea>
                </div>
                <div id="tab-url" class="tab-content">
                    <input type="text" id="context-url" placeholder="請貼上小紅書或網頁 URL...">
                </div>
                <div id="tab-file" class="tab-content">
                    <input type="file" id="context-file" multiple style="width: 100%;">
                    <p style="font-size: 0.8rem; color:#888; margin-top: 8px;">*系統將於提示詞中指示 AI 分析上傳檔案。</p>
                </div>
            </div>

            <div class="section-card" id="output-section" style="display: none;">
                <h3>✨ 最終生成高階提示詞</h3>
                <div class="action-btns" style="margin-top: 0; margin-bottom: 20px;">
                    <button class="primary-btn" onclick="generatePrompt()">🚀 組合生成高階提示詞</button>
                </div>
                <div class="output-area">
                    <textarea id="final-prompt" placeholder="點擊上方按鈕生成提示詞..."></textarea>
                </div>
                <div class="action-btns">
                    <button class="secondary-btn" onclick="copyPrompt()">📋 複製提示詞</button>
                    <button class="secondary-btn" onclick="downloadTXT()">💾 下載為 TXT 檔</button>
                </div>
                <div class="date-info" id="current-date-display"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯保持原狀，完美支援手機端事件觸發 -->
    <script>
        const commonMediaOptions = [
            "Midjourney v6 寫實大師風格 (Hyper-realistic photography, 8k, photorealistic)", "Niji 6 唯美二次元風格 (Anime style, beautiful composition, Niji 6)",
            "東方水墨暈染禪意風格 (Zen ink wash painting)", "精工細作的中國工筆畫 (Meticulous traditional Chinese painting, Gongbi)",
            "敦煌石窟壁畫藝術風 (Dunhuang murals style)", "日本傳統浮世繪木刻版畫 (Ukiyo-e woodblock print, Katsushika Hokusai style)",
            "Sony A7R IV 單眼真實攝影 (8k, 寫實細節)", "徠卡相機復古人文攝影 (Leica M11 photography)", "Lomography LOMO 底片風格 (high contrast, vignette)",

        function renderImageCountSelect() {
            const select = document.getElementById('image-count-select');
            const currentSelected = select.value;
            select.innerHTML = '';
            
            imageCountOptionsList.forEach((count) => {
                const opt = document.createElement('option');
                opt.value = count;
                opt.innerText = count;
                select.appendChild(opt);
            });
            
            const customOpt = document.createElement('option');
            customOpt.value = 'custom';
            customOpt.innerText = '✏️ 自行填寫並新增選項...';
            select.appendChild(customOpt);

            if (currentSelected && imageCountOptionsList.includes(currentSelected)) {
                select.value = currentSelected;
            } else if (currentSelected === 'custom') {
                select.value = 'custom';
            } else {
                select.value = imageCountOptionsList[0];
            }
            handleImageCountSelectChange();
        }

        function loadFrameOptions() {

            if (saved) {
                frameOptionsList = JSON.parse(saved);
            } else {
                frameOptionsList = [...defaultFrames];
            }
            renderFrameSelect();
        }

        function renderFrameSelect() {
            const select = document.getElementById('frame-select');
            const currentSelected = select.value;
            select.innerHTML = '';
            
            frameOptionsList.forEach((frame, index) => {
                const opt = document.createElement('option');
                opt.value = frame;
                if (frame === "隨機創意圖框") {
                    opt.innerText = frame;
                } else {
                    opt.innerText = (index < 9 ? "0" + index : index) + ". " + frame;
                }
                select.appendChild(opt);
            });
            
            const customOpt = document.createElement('option');
            customOpt.value = 'custom';
            customOpt.innerText = '✏️ 自行填寫並新增選項...';
            select.appendChild(customOpt);

            if (currentSelected && frameOptionsList.includes(currentSelected)) {
                select.value = currentSelected;
            } else if (currentSelected === 'custom') {
                select.value = 'custom';
            } else {
                select.value = frameOptionsList[0];
            }

            if (!newFrame) {

            let selectedIndex = parseInt(localStorage.getItem('selectedSigIndex') || '0');

                const radio = document.getElementById(`sig-radio-${i}`);
                if(input && radio) {
                    input.value = sigs[i] || '';
                    radio.checked = (i === selectedIndex);
                }
            }
            updateSummaryDisplay();
        }

        function saveSignatures() {
            let sigs = [];
            let selectedIndex = 0;
            for(let i=0; i<10; i++) {
                const input = document.getElementById(`sig-input-${i}`);
                const radio = document.getElementById(`sig-radio-${i}`);
                if(input && radio) {
                    sigs.push(input.value);
                    if(radio.checked) {

            localStorage.setItem('selectedSigIndex', selectedIndex);

            }

        // 自動翻譯並新增的非同步核心函數
        async function addNewVar(index) {
            const variable = currentFormula.variables[index];
            const input = document.getElementById(`var-custom-${index}`);
            const btn = input.nextElementSibling;
            const zhVal = input.value.trim();
            
            if (!zhVal) {
                alert(`請輸入【${variable.name}】的中文名稱！`);
                return;
            }
            
            let finalVal = zhVal;
            
            // 自動翻譯機制：若沒有手動輸入括號，則呼叫 Google 翻譯 API
            if (!zhVal.includes('(') && !zhVal.includes('（')) {
                btn.innerText = '⏳ 翻譯中...';
                btn.disabled = true;
                try {
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-TW&tl=en&dt=t&q=${encodeURIComponent(zhVal)}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    const enVal = data[0][0][0];
                    if (enVal && enVal.toLowerCase() !== zhVal.toLowerCase()) {
                        finalVal = `${zhVal} (${enVal})`;
                    }
                } catch (err) {
                    console.error("自動翻譯失敗:", err);
                    // 若失敗則保留純中文
                }
                btn.innerText = '➕ 新增';
                btn.disabled = false;
            }
            
            let currentOptions = getCurrentVarOptions(variable);
            if (currentOptions.includes(finalVal)) {
                alert("此選項已存在於清單中！");
                document.getElementById(`var-select-${index}`).value = finalVal;
                handleVarSelectChange(index);
                return;
            }
            
            currentOptions.push(finalVal);
            localStorage.setItem(getVarStorageKey(variable.name), JSON.stringify(currentOptions));
            
            input.value = '';
            renderVarSelectOptions(index);
            document.getElementById(`var-select-${index}`).value = finalVal;
            handleVarSelectChange(index);
            alert("✅ 已成功新增選項！");
        }

        function generatePrompt() {
            if (!currentFormula) return;
            
            let finalPrompt = currentFormula.pattern;

            // 獲取圖片張數設定
            let imageCountStyle = document.getElementById('image-count-select').value;
            if (imageCountStyle === 'custom') {
                imageCountStyle = document.getElementById('image-count-custom').value || '1張';
            }

            // 動態替換原模板中的生成數量，加入強烈防拼貼與獨立生成提示
            if (imageCountStyle === '1張' || imageCountStyle === '1') {
                finalPrompt = finalPrompt.replace(/請為我生成一張/g, `請為我生成 1 張`);
            } else {
                finalPrompt = finalPrompt.replace(/請為我生成一張/g, `請為我「分別」且「獨立」生成 ${imageCountStyle} `);
                
                const antiGridInstruction = `\n\n【生成張數與輸出格式強力約束】\n👉 請務必「分別」生成 ${imageCountStyle} 獨立的圖片。嚴禁將這 ${imageCountStyle} 圖片拼貼、組合或分割成單一圖片（絕對禁止九宮格、四宮格、左右對切等多宮格形式）。每一張產出的結果都必須是單獨、完整的圖檔。`;
                
                if(finalPrompt.includes('【文字與排版設定】')) {
                    finalPrompt = finalPrompt.replace(/(【文字與排版設定】[\s\S]*?)(?=\n\n【|$)/, `$1${antiGridInstruction}`);
                } else if (finalPrompt.includes('【文字與後製指示 (若工具支援)】')) {
                    finalPrompt = finalPrompt.replace(/(【文字與後製指示 \(若工具支援\)】[\s\S]*?)(?=\n\n【|$)/, `$1${antiGridInstruction}`);
                } else {
                    finalPrompt += antiGridInstruction;
                }
            }
            
            // 抓取當前單選框勾選的輸入欄位文字
            saveSignatures(); 
            let signatureInput = "琦閔~祝福您";
            for(let i=0; i<10; i++) {
                if(document.getElementById(`sig-radio-${i}`).checked) {
                    let val = document.getElementById(`sig-input-${i}`).value.trim();
                    if(val) signatureInput = val;
                    break;
                }
            }

            // 確認是否顯示署名
            const showSig = document.getElementById('show-signature').checked;
            
            if (showSig) {
                // 如果有勾選，正常替換署名文字
                finalPrompt = finalPrompt.replace(/琦閔~祝福您|琦閔/g, signatureInput);
            } else {
                // 如果取消勾選，移除所有與署名相關的提示詞句子
                finalPrompt = finalPrompt.replace(/\n2\. 圖片右下方必須顯示創意字體.*?的署名：「琦閔~祝福您」。/g, '');
                finalPrompt = finalPrompt.replace(/影片右下角常駐浮水印：「琦閔」以及/g, '影片右下角常駐顯示');
                finalPrompt = finalPrompt.replace(/影片右下角常駐浮水印：「琦閔」/g, '');
                finalPrompt = finalPrompt.replace(/\n結尾的 \[Outro\] 歌詞必須包含專屬署名：「願你擁有美好的一刻，這裡是琦閔的祝福。」/g, '');
                // 智能修飾
                finalPrompt = finalPrompt.replace(/署名正下方清楚顯示今日日期/g, '圖片右下方清楚顯示今日日期');
            }
            
            // 處理日期勾選框邏輯
            const showDate = document.getElementById('show-date').checked;
            if (showDate) {
                finalPrompt = finalPrompt.replace(/\{今日日期\}/g, formattedDate);
            } else {
                finalPrompt = finalPrompt.replace(/\n3\. 署名正下方清楚顯示今日日期：\{今日日期\}。/g, '');
                finalPrompt = finalPrompt.replace(/\n3\. 圖片右下方清楚顯示今日日期：\{今日日期\}。/g, ''); 
                finalPrompt = finalPrompt.replace(/以及今日日期：\{今日日期\}/g, '');
                finalPrompt = finalPrompt.replace(/影片右下角常駐顯示今日日期：\{今日日期\}。/g, ''); 
            }

            // 🌟 處理圖框選項特效邏輯
            const showFrame = document.getElementById('show-frame').checked;
            if (showFrame && (showSig || showDate)) {
                let frameStyle = document.getElementById('frame-select').value;
                if (frameStyle === 'custom') {
                    frameStyle = document.getElementById('frame-custom').value || '隨機創意圖框';
                }
                const frameInstruction = `\n👉 【圖框特效排版】：請將上述署名與日期完美整合設計於一個「${frameStyle}」之中，並強制設定該圖框大小為佔整體圖片空間版面的 1/8 尺寸，確保字體清晰且與整體視覺風格無縫融合。`;
                
                if(finalPrompt.includes('【文字與排版設定】')) {
                    finalPrompt = finalPrompt.replace(/(【文字與排版設定】[\s\S]*?)(?=\n\n【|$)/, `$1${frameInstruction}`);
                } else if (finalPrompt.includes('【文字與後製指示 (若工具支援)】')) {
                    finalPrompt = finalPrompt.replace(/(【文字與後製指示 \(若工具支援\)】[\s\S]*?)(?=\n\n【|$)/, `$1${frameInstruction}`);
                } else {
                    finalPrompt += `\n\n【圖框特效排版】\n請將署名與日期完美整合設計於一個「${frameStyle}」之中，並設定為整體版面 1/8 的尺寸。`;
                }
            }

            // 處理變數選單
            if (currentFormula.variables) {
                currentFormula.variables.forEach((variable, index) => {
                    const select = document.getElementById(`var-select-${index}`);
                    let value = select.value;
                    
                    if (value === 'custom') {
                        value = document.getElementById(`var-custom-${index}`).value.trim();
                        if(!value) {
                            // 防呆：如果沒有抓到值，預設為該變數清單的第一個選項
                            const currentOpts = getCurrentVarOptions(variable);
                            value = currentOpts.length > 0 ? currentOpts[0] : variable.options[0]; 
                        }
                    }
                    
                    finalPrompt = finalPrompt.replace(`{${variable.name}}`, value);
                });
            }
            
            // 處理附加情境
            let contextStr = "";
            const contextText = document.getElementById('context-text').value.trim();
            const contextUrl = document.getElementById('context-url').value.trim();
            const contextFile = document.getElementById('context-file').files.length;
            
            if (contextText || contextUrl || contextFile > 0) {
                contextStr += "\n\n【附加情境與金句指定】\n";
                if (contextText) contextStr += `- 核心內容：${contextText}\n`;
                if (contextUrl) contextStr += `- 風格參考：${contextUrl}\n`;
                if (contextFile > 0) contextStr += `- 需分析上傳之檔案做為排版參考。\n`;
            }
            
            document.getElementById('final-prompt').value = finalPrompt + contextStr;
            
            document.querySelector('.main-content').scrollTo({
                top: document.querySelector('.main-content').scrollHeight,
                behavior: 'smooth'
            });
            
            document.getElementById('sig-dropdown').removeAttribute('open');
        }

        function copyPrompt() {
            const textarea = document.getElementById('final-prompt');
            if(!textarea.value) {
                alert("請先生成提示詞！");
                return;
            }
            textarea.select();
            document.execCommand('copy');
            alert('✅ 提示詞已複製到剪貼簿！');
        }

        function downloadTXT() {
            const text = document.getElementById('final-prompt').value;
            if(!text) {
                alert("請先生成提示詞！");
                return;
            }
            const timePrefix = currentFormula.name.includes("早安") ? "早安" : (currentFormula.name.includes("午安") ? "午安" : (currentFormula.name.includes("晚安") ? "晚安" : "問候"));
            const blob = new Blob([text], { type: 'text/plain' });
            const anchor = document.createElement('a');
            anchor.download = `AI${timePrefix}提示詞_${formattedDate}.txt`;
            anchor.href = window.URL.createObjectURL(blob);
            anchor.target = '_blank';
            anchor.style.display = 'none';
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }

        window.onload = initSidebar;
    </script>
</body>
</html>
